name: Site check
"on":
  schedule:
    # Every 4 hours at minute 0, UTC: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check site
        env:
          URL: ${{ secrets.SITE }}
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_GA }}
        run: |
          set +e

          URL=$(printf '%s' "$URL" | tr -d '[:space:]')
          if [ -z "$URL" ]; then
            echo "ERROR: SITE secret is missing or empty."
            echo "SITE secret is empty." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -z "$WEBHOOK" ]; then
            echo "ERROR: SLACK_WEBHOOK_GA secret is missing or empty."
            echo "SLACK_WEBHOOK_GA secret is empty." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # $1 = message text, $2 = Slack color: good (success) or danger (failure)
          notify() {
            payload=$(python3 -c 'import json,sys; print(json.dumps({"attachments":[{"color":sys.argv[2],"text":sys.argv[1]}]}))' "$1" "$2")
            echo "Posting to SLACK_WEBHOOK_GA"
            body=$(curl -sS -w "\n%{http_code}" -X POST \
              -H "Content-type: application/json" \
              --data "$payload" \
              --max-time 30 \
              "$WEBHOOK")
            rc=$?
            echo "$body"
            if [ "$rc" -ne 0 ]; then
              echo "ERROR: curl to SLACK_WEBHOOK_GA failed (exit $rc)."
              return 1
            fi
            return 0
          }

          code=000
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -L -w "%{http_code}" --max-time 30 "$URL" || true)
            code=$(printf '%s' "$code" | tr -cd '0-9')
            if [ -z "$code" ]; then
              code=000
            fi
            if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
              echo "Site is up (HTTP $code) on attempt $i."
              echo "UP HTTP $code on attempt $i" >> "$GITHUB_STEP_SUMMARY"
              notify "Site check successful: $URL is up (HTTP $code)" good
              exit 0
            fi
            echo "Attempt $i failed (HTTP $code)."
            if [ "$i" -lt 3 ]; then
              sleep 30
            fi
          done

          echo "DOWN after 3 tries, last HTTP $code" >> "$GITHUB_STEP_SUMMARY"
          notify "Site check failed: $URL is DOWN after 3 tries (HTTP $code)" danger
          exit 1
