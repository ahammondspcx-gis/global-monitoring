name: Site check

"on":
  schedule:
    - cron: '0 */4 * * *' # every 4 hours, UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check site
        env:
          # URL: ${{ secrets.SITE }} # PROD: real site
          URL: https://thissitedoesnotexist.com # TEST: fake site to force an alert
          # Two lines so one run shows which secret lands in which channel.
          WEBHOOK_SLACK_GA_MONITORING: ${{ secrets.SLACK_GA_MONITORING }}
          # WEBHOOK_SLACK_WEBHOOK_GA: ${{ secrets.SLACK_WEBHOOK_GA }}
        run: |
          # Stop early if a required secret is missing
          if [ -z "${URL}" ]; then
            echo "ERROR: SITE secret is missing or empty."
            exit 1
          fi
          if [ -z "${WEBHOOK_SLACK_GA_MONITORING}" ] || [ -z "${WEBHOOK_SLACK_WEBHOOK_GA}" ]; then
            echo "ERROR: One or both Slack webhook secrets are missing or empty."
            echo "Need secrets SLACK_GA_MONITORING and SLACK_WEBHOOK_GA."
            exit 1
          fi

          # Send the same message to both webhooks. The label is the secret name.
          notify() {
            text="$1"
            label="$2"
            hook="$3"
            payload=$(jq -nc --arg text "[$label] $text" '{text:$text}')
            echo "Posting to $label"
            curl -sS -w "\nSlack HTTP %{http_code} ($label)\n" -X POST \
              -H 'Content-type: application/json' \
              --data "$payload" \
              --max-time 30 \
              "$hook"
          }

          # Try up to 3 times before reporting an error
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -L -w '%{http_code}' --max-time 30 "$URL" || true)
            case "$code" in
              [1-9][0-9][0-9]) ;;
              *) code=000 ;;
            esac
            if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
              echo "Site is up (HTTP $code) on attempt $i."
              notify "$URL is up (HTTP $code)" "SLACK_GA_MONITORING" "$WEBHOOK_SLACK_GA_MONITORING"
              notify "$URL is up (HTTP $code)" "SLACK_WEBHOOK_GA" "$WEBHOOK_SLACK_WEBHOOK_GA"
              exit 0
            fi
            echo "Attempt $i failed (HTTP $code)."
            if [ "$i" -lt 3 ]; then
              sleep 30 # PROD
              # sleep 15 # TEST
            fi
          done

          # All 3 tries failed - send error to both webhooks
          notify "$URL is DOWN after 3 tries (HTTP $code)" "SLACK_GA_MONITORING" "$WEBHOOK_SLACK_GA_MONITORING"
          notify "$URL is DOWN after 3 tries (HTTP $code)" "SLACK_WEBHOOK_GA" "$WEBHOOK_SLACK_WEBHOOK_GA"
          exit 1
