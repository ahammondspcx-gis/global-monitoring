name: Site check
"on":
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check site
        env:
          # URL: ${{ secrets.SITE }}
          URL: https://thissitedoesnotexisit.com
          # Keep exactly one pair uncommented.
          # WEBHOOK: ${{ secrets.SLACK_GA_MONITORING }}
          # WEBHOOK_NAME: SLACK_GA_MONITORING
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_GA }}
          WEBHOOK_NAME: SLACK_WEBHOOK_GA
        run: |
          set +e

          URL=$(printf '%s' "$URL" | tr -d '[:space:]')
          if [ -z "$URL" ]; then
            echo "ERROR: SITE secret is missing or empty."
            echo "SITE secret is empty." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -z "$WEBHOOK" ]; then
            echo "ERROR: webhook secret is missing or empty ($WEBHOOK_NAME)."
            echo "Webhook secret is empty ($WEBHOOK_NAME)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          notify() {
            payload=$(python3 -c 'import json,sys; print(json.dumps({"text": sys.argv[1]}))' "[$WEBHOOK_NAME] $1")
            echo "Posting to $WEBHOOK_NAME"
            body=$(curl -sS -w "\n%{http_code}" -X POST \
              -H "Content-type: application/json" \
              --data "$payload" \
              --max-time 30 \
              "$WEBHOOK")
            rc=$?
            echo "$body"
            if [ "$rc" -ne 0 ]; then
              echo "ERROR: curl to $WEBHOOK_NAME failed (exit $rc)."
              return 1
            fi
            return 0
          }

          code=000
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -L -w "%{http_code}" --max-time 30 "$URL" || true)
            code=$(printf '%s' "$code" | tr -cd '0-9')
            if [ -z "$code" ]; then
              code=000
            fi
            if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
              echo "Site is up (HTTP $code) on attempt $i."
              echo "UP HTTP $code on attempt $i via $WEBHOOK_NAME" >> "$GITHUB_STEP_SUMMARY"
              notify "$URL is up (HTTP $code)"
              exit 0
            fi
            echo "Attempt $i failed (HTTP $code)."
            if [ "$i" -lt 3 ]; then
              sleep 30
            fi
          done

          echo "DOWN after 3 tries, last HTTP $code via $WEBHOOK_NAME" >> "$GITHUB_STEP_SUMMARY"
          notify "$URL is DOWN after 3 tries (HTTP $code)"
          exit 1
